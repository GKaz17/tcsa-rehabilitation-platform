# Routing excerpt for Azure App Service on Linux with PHP.
# Review and merge into the selected runtime's existing Nginx server block.
# Keep its listener, PHP-FPM upstream, TLS/proxy settings and platform routes.
# This excerpt is not a standalone configuration and has not been applied.

root /home/site/wwwroot/client/dist;
index index.html;
error_page 404 /404.html;

location = / { try_files /index.html =404; }
location = /index.html { return 301 /; }
location = /about { return 301 "/#about-us"; }
location = /support { return 301 "/#support-us"; }
location = /contact { return 301 "/#contact-dirk"; }
location = /education { return 301 "/#education"; }
location = /login { return 301 /staff/login; }

location ~ ^/(staff|dashboard)(/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    rewrite ^ /staff.html last;
}
location = /staff.html {
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    try_files /staff.html =404;
}
location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location /api/ { return 404; }
# Replace any default catch-all PHP location with this endpoint whitelist.
# Verify fastcgi_pass against the actual PHP image before enabling it.
location ~ ^/api/(health|workspace|animals|tasks|history|reports|auth/(session|login|logout|me|password))\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/site/wwwroot$fastcgi_script_name;
    fastcgi_param HTTPS $https;
    fastcgi_pass 127.0.0.1:9000;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}

location ~ /\. { return 404; }
location ~ \.php$ { return 404; }
location / { try_files $uri =404; }

user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
# AWS ALB supplies X-Forwarded-Proto. Admit application traffic only from its security group.
map $http_x_forwarded_proto $tcsa_https {
    default off;
    https on;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /var/www/tcsa/public;
    index index.html;
    server_tokens off;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    error_page 404 /404.html;

    location = / { try_files /index.html =404; }
    location = /index.html { return 301 /; }
    location = /about { return 301 "/#about-us"; }
    location = /support { return 301 "/#support-us"; }
    location = /contact { return 301 "/#contact-dirk"; }
    location = /education { return 301 "/#education"; }
    location = /login { return 301 /staff/login; }

    location ~ ^/(staff|dashboard)(/|$) { rewrite ^ /staff.html last; }
    location = /staff.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files /staff.html =404;
    }
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ ^/api/(health|workspace|animals|tasks|history|reports|auth/(session|login|logout|me|password))\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/tcsa$fastcgi_script_name;
        fastcgi_param HTTPS $tcsa_https;
        fastcgi_pass 127.0.0.1:9000;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location /api/ { return 404; }
    location ~ /\. { return 404; }
    location ~ \.php(?:/|$) { return 404; }
    location / { try_files $uri =404; }
}

}

# Copy to .github/workflows/main_tcsa-rehabilitation-gkaz17.yml only after review.
# Replace the three placeholder secret names with the names generated by Azure.
name: Build and deploy TCSA to Azure

on:
  workflow_dispatch:

concurrency:
  group: tcsa-azure-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://tcsa-rehabilitation-gkaz17-hebyf0hnd4cze8cb.southafricanorth-01.azurewebsites.net
      VITE_ALLOW_INDEXING: 'true'
      VITE_GA4_ID: G-Z0XK8ERT14
      TCSA_SETUP_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci
        working-directory: client
      - run: npm run lint && npm test && npm run build && npm run test:seo
        working-directory: client
      - name: Check PHP syntax
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify sign-in and care workflows against isolated test databases
        run: node --test api/tests/auth.integration.mjs
      - run: node deployment/package.mjs
      - run: node --test deployment/package.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tcsa-release
          path: dist/azure/
          if-no-files-found: error
          retention-days: 3
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tcsa-release
          path: release
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.__clientidsecretname__ }}
          tenant-id: ${{ secrets.__tenantidsecretname__ }}
          subscription-id: ${{ secrets.__subscriptionidsecretname__ }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: tcsa-rehabilitation-gkaz17
          slot-name: Production
          package: release
